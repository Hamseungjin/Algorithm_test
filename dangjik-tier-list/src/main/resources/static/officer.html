<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>당직사관 상세</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<header>
  <h1>🎖️ 당직사관 티어리스트</h1>
  <nav>
    <a href="/index.html">홈</a>
    <a href="/admin.html">관리자</a>
  </nav>
</header>

<main>

  <!-- 뒤로가기 -->
  <a href="/index.html" style="font-size:.85rem;color:var(--text-sub);display:inline-block;margin-bottom:20px;">
    ← 목록으로
  </a>

  <!-- 헤더 정보 -->
  <div class="detail-header">
    <div class="info">
      <div style="margin-bottom:8px;" id="detailTier"></div>
      <h2 id="detailName">-</h2>
      <div class="sub" id="detailRank">-</div>
    </div>
  </div>

  <!-- 통계 박스 -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="label">총 승점</div>
      <div class="value" id="statScore">-</div>
    </div>
    <div class="stat-box">
      <div class="label">평균 불출시간</div>
      <div class="value" id="statDist">-</div>
    </div>
    <div class="stat-box">
      <div class="label">평균 반납시간</div>
      <div class="value" id="statReturn">-</div>
    </div>
    <div class="stat-box">
      <div class="label">평균 평점</div>
      <div class="value" id="statRating">-</div>
    </div>
  </div>

  <!-- 평점 -->
  <div class="card" style="margin-bottom:24px;">
    <div style="font-size:.95rem;font-weight:600;margin-bottom:12px;">⭐ 평점 등록</div>
    <div id="ratingContainer">
      <div style="color:var(--text-sub);">불러오는 중...</div>
    </div>
  </div>

  <!-- 당직 기록 -->
  <div class="card">
    <div style="font-size:.95rem;font-weight:600;margin-bottom:16px;">📋 당직 기록</div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>불출시간</th>
            <th>불출점수</th>
            <th>반납시간</th>
            <th>반납점수</th>
            <th>합계</th>
            <th>특이사항</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
    </div>
  </div>

</main>

<div id="toast"></div>
<script src="/js/app.js"></script>
<script>initDetailPage();</script>
</body>
</html>
